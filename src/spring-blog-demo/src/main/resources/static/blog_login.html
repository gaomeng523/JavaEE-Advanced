<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客登陆页</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>
    <div class="nav">
        <div class="nav-inner">
            <a class="nav-logo" href="blog_list.html">
                <img src="pic/logo2.jpg" alt="logo">
                <span>我的博客</span>
            </a>
            <div class="nav-menu">
                <a class="nav-link" href="blog_list.html">首页</a>
                <a class="nav-link nav-write" href="blog_edit.html">写博客</a>
            </div>
        </div>
    </div>

    <div class="container-login">
        <div class="login-dialog">
            <h3>登陆</h3>
            <div class="row">
                <span>用户名</span>
                <input type="text" name="userName" id="userName">
            </div>
            <div class="row">
                <span>密码</span>
                <input type="password" name="password" id="password">
            </div>
            <div class="row">
                <button id="submit" onclick="login()">提交</button>
            </div>

        </div>
    </div>
    <script src="js/jquery.min.js"></script>
    <script src="js/common.js"></script>
    <script>
        // 登录请求是否已在处理中，防止网络慢时连点 / 狂按回车发出多个登录请求
        var logining = false;

        // 是否正在因为「已登录」而跳走。
        // location.replace() 是异步的，它挂起后页面还会继续执行一小段时间，
        // 期间用户完全可能再点一次「提交」，导致登录请求的结果被这次跳转冲掉。
        // 用一个标志位把这种情况挡掉。
        var leaving = false;

        // 已经登录的人不该再看到登录页，按 redirect 参数跳走，没有就回首页。
        // 放在这里而不是 $(function(){}) 里，是为了尽早跳转、避免页面闪一下。
        if (isLogin()) {
            var redirectUrl = new URLSearchParams(location.search).get("redirect");
            if (redirectUrl) {
                leaving = true;
                location.replace(redirectUrl);
            }
            // 没有 redirect 参数时**不自动跳转**，让用户自己点「主页」。
            // 否则一旦 localStorage 里残留着失效 token，就会形成
            // 「跳到首页 → 首页 401 → 跳回登录页 → 又判定已登录 → 再跳走」的死循环，
            // 用户永远登录不上（日志里反复出现的 /user/getUserInfo 401 警告就是这个现象）。
        }

        function login() {
            // 正在跳转中，忽略这次点击
            if (logining || leaving) {
                return;
            }

            var userName = $('#userName').val().trim();
            var password = $('#password').val();

            // 前端先做一层空值校验，避免无意义的请求
            if (!userName) {
                alert("请输入用户名");
                return;
            }
            if (!password) {
                alert("请输入密码");
                return;
            }

            logining = true;
            $.ajax({
                url: '/user/login',
                type: 'post',
                contentType: 'application/json',
                // 注意是 JSON.stringify 而不是 JSON.parse：
                // 要把 JS 对象【序列化】成 JSON 字符串发给后端，parse 是反过来的操作
                data: JSON.stringify({
                    // 字段名必须和后端 UserLoginRequest 的属性名一致（userName 首字母大写 N）
                    // 写成 username 后端收不到，字段会是 null，直接触发参数校验失败
                    userName: userName,
                    password: password
                }),
                success: function (result) {
                    if (result != null && result.code == 200 && result.data != null) {
                        var data = result.data;
                        localStorage.setItem("loginUserId", data.id);
                        localStorage.setItem("userToken", data.token);

                        // 支持登录后跳回原来想访问的页面：
                        // 由 requireLogin() 拼出 blog_login.html?redirect=%2Fblog_edit.html
                        var redirect = new URLSearchParams(location.search).get("redirect");
                        if (redirect) {
                            location.assign(redirect);
                        } else {
                            location.assign("blog_list.html");
                        }
                        return;
                    }
                    // 业务失败（用户名或密码错误）也会走这里，因为 HTTP 状态码是 200
                    logining = false;
                    alert(result && result.errMsg ? result.errMsg : "登录失败");
                },
                error: function (error) {
                    // 无论哪种失败都要放开闸门，让用户能重试
                    logining = false;
                    if (error.status == 400) {
                        // 后端参数校验失败会返回 400，错误消息在 responseJSON.errMsg 里
                        var msg = error.responseJSON && error.responseJSON.errMsg;
                        alert(msg || "参数校验失败");
                    } else {
                        // 原先只处理了 400，网络断了 / 后端没启动时会完全没有反应
                        alert("登录失败，请检查网络或后端服务是否已启动");
                    }
                }
            });
        }

        // 支持回车提交，体验更好
        $(document).keydown(function (e) {
            // 只在登录页按回车时才触发，避免输入法选词的回车误触发
            if (e.key === "Enter") {
                login();
            }
        });
    </script>
</body>

</html>
