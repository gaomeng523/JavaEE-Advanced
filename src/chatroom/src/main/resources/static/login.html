<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 网页聊天室</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="nav"><span>&#128172; 网页聊天室</span></div>
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">&#128172;</div>
                <h3>欢迎回来</h3>
                <p>登录你的账号，开始聊天</p>
            </div>
            <div class="login-body">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" class="input-field" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" class="input-field" placeholder="请输入密码">
                </div>
                <button id="submit" class="login-btn">登 录</button>
            </div>
            <div class="login-footer">还没有账号？<a href="register.html">立即注册</a></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        let submitButton = document.querySelector('#submit');
        let passwordInput = document.querySelector('#password');

        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitButton.click();
        });

        submitButton.onclick = function() {
            let username = document.querySelector('#username').value.trim();
            let password = document.querySelector('#password').value;
            if (!username || !password) { alert('请输入用户名和密码！'); return; }

            $.ajax({
                method: 'post', url: '/login',
                data: { username: username, password: password },
                success: function(data) {
                    if (data && data.userId > 0) {
                        alert("登录成功！");
                        location.assign('/client.html');
                    } else {
                        alert("登录失败！用户名密码错误，或该账号已在别处登录！");
                    }
                },
                error: function() { alert("网络错误，请稍后重试！"); }
            });
        }
    </script>
</body>
</html>
