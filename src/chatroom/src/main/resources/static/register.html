<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 网页聊天室</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="nav"><span>&#128172; 网页聊天室</span></div>
    <div class="container">
        <div class="register-card">
            <div class="register-header">
                <div class="logo">&#9997;</div>
                <h3>创建账号</h3>
                <p>注册一个新账号，加入聊天室</p>
            </div>
            <div class="register-body">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" class="input-field" placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" class="input-field" placeholder="请输入密码">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="confirmPassword" class="input-field" placeholder="请再次输入密码">
                </div>
                <button id="submit" class="register-btn">注 册</button>
            </div>
            <div class="register-footer">已有账号？<a href="login.html">去登录</a></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        let submitButton = document.querySelector('#submit');
        let confirmInput = document.querySelector('#confirmPassword');

        confirmInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitButton.click();
        });

        submitButton.onclick = function() {
            let username = document.querySelector('#username').value.trim();
            let password = document.querySelector('#password').value;
            let confirmPassword = document.querySelector('#confirmPassword').value;

            if (!username || !password) { alert('请输入用户名和密码！'); return; }
            if (password !== confirmPassword) { alert('两次输入的密码不一致！'); return; }

            $.ajax({
                method: 'post', url: '/register',
                data: { username: username, password: password },
                success: function(data) {
                    if (data && data.username) {
                        alert('注册成功！');
                        location.assign('/login.html');
                    } else {
                        alert("注册失败！用户名可能已存在。");
                    }
                },
                error: function() { alert("网络错误，请稍后重试！"); }
            });
        }
    </script>
</body>
</html>
